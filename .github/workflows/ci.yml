name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install root dependencies
        run: npm install

      - name: Install backend dependencies
        run: npm install
        working-directory: ./homeremedis-api

      - name: Run backend tests (Phase 1)
        run: npm test
        working-directory: ./homeremedis-api
        env:
          MONGO_URI: mongodb://localhost:27017/homeremedis_test
          ADMIN_KEY: supersecretadmin

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./frontend

      - name: Run frontend tests (Phase 2)
        run: npm test
        working-directory: ./frontend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy Placeholder
        run: echo "Tests passed! Triggering deployment to Render/Vercel (Phase 6)."
